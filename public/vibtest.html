<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Test de vibracion</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      .btn.done { background: #00b894 !important; color: #04241c !important; }
      #log { max-height: 240px; overflow: auto; font-size: 0.72rem; color: #9aa0b5; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Test de vibracion</h1>
      <p class="sub">Toca cada boton. El boton se pone VERDE si el toque se registra.</p>

      <div class="card">
        <div id="diag" class="status"></div>
        <button class="btn" type="button" onclick="tap(this,1)">1. Un pulso largo 1s</button>
        <button class="btn" type="button" onclick="tap(this,2)">2. Array 1 elemento</button>
        <button class="btn" type="button" onclick="tap(this,3)">3. Array 2 elementos</button>
        <button class="btn" type="button" onclick="tap(this,4)">4. Array 2 pulsos</button>
        <button class="btn" type="button" onclick="tap(this,5)">5. Timers 3 pulsos seguidos</button>
        <button class="btn" type="button" onclick="tap(this,6)">6. Timers 3 pulsos sep 1s</button>
        <button class="btn" type="button" onclick="tap(this,7)">7. Array 3 pulsos</button>
      </div>

      <div class="card">
        <label>Datos del navegador (linea UA)</label>
        <textarea id="uaBox" readonly style="width: 100%; height: 90px; font-size: 0.72rem; background: #11121f; color: #f5f6fa; border: 1px solid #2e3050; border-radius: 10px; padding: 8px"></textarea>
        <button id="copyUa" class="btn" type="button">Copiar UA</button>
      </div>

      <div class="card">
        <label>Log (tocazos registrados)</label>
        <pre id="log">(cargando...)</pre>
      </div>
    </div>

    <script>
      var logEl = document.getElementById('log');
      var n = 0;
      function log(msg) { logEl.textContent += '\n' + msg; }
      logEl.textContent = 'script OK | vibrate=' + (typeof navigator.vibrate === 'function') + '\nUA: ' + navigator.userAgent;

      var uaBox = document.getElementById('uaBox');
      uaBox.value = navigator.userAgent;
      document.getElementById('copyUa').addEventListener('click', function () {
        uaBox.select();
        try { document.execCommand('copy'); } catch (e) {}
        this.textContent = 'Copiado!';
      });

      if (typeof navigator.vibrate === 'function') {
        document.getElementById('diag').textContent = 'API vibrate disponible';
      } else {
        document.getElementById('diag').textContent = 'API vibrate NO disponible';
      }

      function chained(durs, gap) {
        var i = 0;
        (function next() {
          if (i >= durs.length) return;
          navigator.vibrate(durs[i]);
          var d = durs[i];
          i++;
          setTimeout(next, d + gap);
        })();
      }

      function tap(btn, t) {
        n++;
        btn.classList.add('done');
        var res;
        if (!(window.navigator && navigator.vibrate)) { res = 'sin API'; }
        else if (t === 1) res = navigator.vibrate(1000);
        else if (t === 2) res = navigator.vibrate([1000]);
        else if (t === 3) res = navigator.vibrate([1000, 0]);
        else if (t === 4) res = navigator.vibrate([500, 400, 500, 0]);
        else if (t === 5) { chained([400, 400, 400], 300); res = 'enviado'; }
        else if (t === 6) { chained([400, 400, 400], 1000); res = 'enviado'; }
        else if (t === 7) res = navigator.vibrate([130, 650, 420, 260, 420, 260, 420, 0]);
        log('#' + n + ' test ' + t + ' -> ' + res);
      }
    </script>
  </body>
</html>
