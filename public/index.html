<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vota</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="display">
    <div id="stage" class="stage">
      <main class="stage-main">
        <h1 class="center">Vota</h1>
        <p id="phaseLine" class="sub center">Esperando...</p>

        <div id="questionCard" class="card hidden">
          <div id="questionText" class="question"></div>
          <div id="optionsList" class="options" style="margin-top: 16px"></div>
        </div>

        <div id="resultsCard" class="card hidden">
          <div class="reveal-title">Resultados</div>
          <div id="results" class="results"></div>
        </div>
      </main>

      <aside class="stage-side">
        <div id="voteCard" class="card center">
          <p class="sub" style="margin-bottom: 10px">Escanear para votar</p>
          <div id="qr"></div>
          <p class="sub" style="margin: 12px 0 0">Escribi en el navegador:</p>
          <div id="voterUrlBig" class="url"></div>
          <p class="sub" style="margin: 10px 0 0; font-size: 0.72rem">
            <a href="/voter.html">Votar</a> &middot; <a href="/host.html">Panel</a>
          </p>
        </div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
