services:
  - type: web
    name: vota
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST_TOKEN
        sync: false
      - key: VOTE_SECONDS
        value: "30"
      - key: GITHUB_TOKEN
        sync: false
      - key: GIST_ID
        sync: false
